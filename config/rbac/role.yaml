---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: warmpool-manager
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update
- apiGroups:
  - linkedin.com
  resources:
  - workerclaims
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - linkedin.com
  resources:
  - workerclaims/finalizers
  - workerpools/finalizers
  verbs:
  - update
- apiGroups:
  - linkedin.com
  resources:
  - workerclaims/status
  - workerpools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - linkedin.com
  resources:
  - workerpools
  verbs:
  - get
  - list
  - watch
